schema_version: 1
name: geo-explorer
title: Geographic Explorer
description: Map-led dashboard with supporting detail views.
priority: 50
base_score: 5
intents: [geographic]
requirements: {geographic: true}
preferences:
  geographic: true
  kpi_count: [0, 3]
  chart_count: [2, 3]
  filter_count: [0, 4]
  chart_types: {Map: 8, Bar: 3, Line: 2}
slots:
  map: {mode: single, min: 1, max: 1}
  details: {mode: horizontal, min: 1, max: 2}
layout:
  type: container
  direction: vertical
  children:
    - {type: text, text: Geographic Explorer, fixed_size: 70, font_size: '20', bold: true}
    - {type: slot, slot: map, weight: 3}
    - {type: slot, slot: details, weight: 1}
