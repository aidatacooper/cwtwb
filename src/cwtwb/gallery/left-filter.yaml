schema_version: 1
name: left-filter
title: Left Filter Panel
description: Filter-heavy dashboard with a dedicated left-side control worksheet.
priority: 70
base_score: 5
intents: [filter-heavy]
preferences:
  kpi_count: [1, 4]
  chart_count: [2, 4]
  filter_count: [3, 8]
  chart_types: {Bar: 4, Line: 4, Area: 3, Pie: 2}
slots:
  filter_panel: {mode: single, min: 1, max: 1}
  kpis: {mode: horizontal, min: 1, max: 4}
  charts: {mode: grid-2x2, min: 2, max: 4}
layout:
  type: container
  direction: horizontal
  children:
    - {type: slot, slot: filter_panel, fixed_size: 220}
    - type: container
      direction: vertical
      weight: 1
      children:
        - {type: text, text: Filtered Analysis, fixed_size: 70, font_size: '20', bold: true}
        - {type: slot, slot: kpis, fixed_size: 110}
        - {type: slot, slot: charts, weight: 1}
