schema_version: 1
name: comparison
title: Comparison
description: Equal side-by-side views for comparing categories, segments, or measures.
priority: 30
base_score: 5
intents: [comparison]
preferences:
  kpi_count: [0, 2]
  chart_count: [2, 4]
  filter_count: [0, 3]
  chart_types: {Bar: 5, Heatmap: 3, Pie: 2, Line: 2}
slots:
  charts: {mode: grid-2x2, min: 2, max: 4}
layout:
  type: container
  direction: vertical
  children:
    - {type: text, text: Comparison, fixed_size: 70, font_size: '20', bold: true}
    - {type: slot, slot: charts, weight: 1}
