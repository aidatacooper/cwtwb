schema_version: 1
name: trend-analysis
title: Trend Analysis
description: Time-series-focused dashboard with a prominent trend and supporting views.
priority: 40
base_score: 5
intents: [trend]
requirements: {temporal: true}
preferences:
  temporal: true
  kpi_count: [1, 4]
  chart_count: [2, 4]
  filter_count: [0, 3]
  chart_types: {Line: 6, Area: 5, Bar: 2}
slots:
  kpis: {mode: horizontal, min: 1, max: 4}
  trend: {mode: single, min: 1, max: 1}
  details: {mode: horizontal, min: 1, max: 2}
layout:
  type: container
  direction: vertical
  children:
    - {type: text, text: Trend Analysis, fixed_size: 70, font_size: '20', bold: true}
    - {type: slot, slot: kpis, fixed_size: 110}
    - {type: slot, slot: trend, weight: 2}
    - {type: slot, slot: details, weight: 1}
